name: windows

on:
  push:
    paths:
      - 'windowsApp/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windowsApp/**'
  workflow_dispatch:

jobs:
  core:
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windowsApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/Rally.Tests -c Release
      # WinUI needs VS AppxPackage tasks: build the app with MSBuild, not dotnet.
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild src/Rally.App/Rally.App.csproj /p:Configuration=Release /p:Platform=${{ matrix.arch }} /p:RuntimeIdentifier=win-${{ matrix.arch }} /restore
      # Side-loadable exe: self-contained publish + zip (unsigned in CI;
      # sign locally with packaging/package.ps1 -SelfSign for your boxes).
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/package.ps1 -Version 0.8.2 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Rally-Windows-${{ matrix.arch }}
          # NOTE: uses: steps ignore defaults.run.working-directory — path from repo root.
          path: |
            windowsApp/dist/Rally-*-Windows-*.zip
            windowsApp/dist/Rally-*-Windows-*.zip.sha256
