name: windows

on:
  push:
    paths:
      - 'windowsApp/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windowsApp/**'
  workflow_dispatch:

jobs:
  core:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windowsApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/Rally.Tests -c Release
      # WinUI needs VS AppxPackage tasks: build the app with MSBuild, not dotnet.
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild src/Rally.App/Rally.App.csproj /p:Configuration=Release /p:Platform=x64 /restore
      # Side-loadable exe: self-contained publish + zip (unsigned in CI;
      # sign locally with packaging/package.ps1 -SelfSign for your boxes).
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/package.ps1 -Version 0.4.0
      - uses: actions/upload-artifact@v4
        with:
          name: Rally-Windows-x64
          path: dist/Rally-*-Windows-*.zip
